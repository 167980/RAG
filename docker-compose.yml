version: '3.8'

services:
  fast-api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    depends_on:
      - postgres-db

  postgres-db:
    image: ankane/pgvector:latest  # Comes with pgvector pre-installed
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: new_project
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
